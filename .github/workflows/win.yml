name: Windows

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Windows 2025 x86 MSVC", os: windows-2025, arch: x64 }
          - { name: "Windows 11 arm MSVC", os: windows-11-arm, arch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.config.arch }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        if: matrix.build_type == 'Debug'
        run: python -m pip install pytest

      - name: Configure CMake
        run: |
          # /Z7 avoids parallel MSVC compiler PDB writes in Debug.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_FLAGS_DEBUG="/Z7 /Ob0 /Od /RTC1" `
            -DPYTHON_ENFORCE_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} `
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library and bindings
        if: matrix.build_type == 'Release'
        run: cmake --build build --parallel --target ariadne-rendering bindings benchmarks

      - name: Install Release library and bindings
        if: matrix.build_type == 'Release'
        run: cmake --install build --prefix "${{ runner.workspace }}/install"

      - name: Build Debug tests and bindings
        if: matrix.build_type == 'Debug'
        run: cmake --build build --parallel --target tests

      - name: Run Debug C++ tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build -LE python --output-on-failure

      - name: Run Debug Python tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build -L python --output-on-failure

      - name: Prepare C++ Rendering tutorial
        if: matrix.build_type == 'Release'
        run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorials/tutorial_rendering" "${{ runner.workspace }}/tutorial_rendering"

      - name: Build and run C++ Rendering tutorial
        if: matrix.build_type == 'Release'
        shell: pwsh
        working-directory: ${{ runner.workspace }}/tutorial_rendering
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "${{ runner.workspace }}\install\bin;$env:PATH"
          # Run inside build so relative PNG paths match the Unix job and the verification below.
          Push-Location build
          & ".\tutorial_rendering.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          python -c "from pathlib import Path; names=['layers','layers_large','cleared','projection_xy','projection_xz','plot']; files=[Path('build/tutorial_rendering_'+n+'.png') for n in names]; assert all(p.exists() and p.read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a') for p in files), files"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python Rendering tutorial
        if: matrix.build_type == 'Release'
        shell: pwsh
        working-directory: ${{ github.workspace }}/python/tutorials
        run: |
          $env:PATH = "${{ runner.workspace }}\install\bin;$env:PATH"
          $env:PYTHONPATH = "${{ github.workspace }}\build\python"
          python tutorial_rendering.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; files=[Path('tutorial_rendering_empty.png'),Path('tutorial_rendering_cleared.png')]; assert all(p.exists() and p.read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a') for p in files), files"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Verify Release uninstallation
        if: matrix.build_type == 'Release'
        working-directory: ${{ github.workspace }}/build
        run: cmake --build . --target uninstall
