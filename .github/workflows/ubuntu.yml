name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Ubuntu 24.04 x86 Clang 16", os: ubuntu-24.04, cxx: "clang++-16" }
          - { name: "Ubuntu 24.04 arm Clang 16", os: ubuntu-24.04-arm, cxx: "clang++-16" }
          - { name: "Ubuntu 24.04 x86 GCC 12", os: ubuntu-24.04, cxx: "g++-12" }
          - { name: "Ubuntu 24.04 arm GCC 12", os: ubuntu-24.04-arm, cxx: "g++-12" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        if: matrix.build_type == 'Debug'
        run: python -m pip install pytest

      - name: Get Linux concurrency
        if: runner.os == 'Linux'
        run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      - name: Set up Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config clang-16 g++-12

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DPYTHON_ENFORCE_TESTS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library and bindings
        if: matrix.build_type == 'Release'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target ariadne-rendering bindings benchmarks

      - name: Install Release library and bindings
        if: matrix.build_type == 'Release'
        run: cmake --install "${{ runner.workspace }}/build" --prefix "${{ runner.workspace }}/install"

      - name: Build Debug tests and bindings
        if: matrix.build_type == 'Debug'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target tests

      - name: Run Debug C++ tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir "${{ runner.workspace }}/build" -j "$NPROC" -LE python --output-on-failure

      - name: Run Debug Python tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir "${{ runner.workspace }}/build" -L python --output-on-failure

      - name: Prepare C++ Rendering tutorial
        if: matrix.build_type == 'Release'
        run: cmake -E copy_directory "$GITHUB_WORKSPACE/tutorials/tutorial_rendering" "${{ runner.workspace }}/tutorial_rendering"

      - name: Build and run C++ Rendering tutorial
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.workspace }}/tutorial_rendering
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" \
            -DCMAKE_CXX_COMPILER="${{ matrix.config.cxx }}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --parallel "$NPROC"
          export LD_LIBRARY_PATH="${{ runner.workspace }}/install/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="${{ runner.workspace }}/install/lib:${DYLD_LIBRARY_PATH:-}"
          (cd build && ./tutorial_rendering)
          python -c "from pathlib import Path; names=['layers','layers_large','cleared','projection_xy','projection_xz','plot']; files=[Path('build/tutorial_rendering_'+n+'.png') for n in names]; assert all(p.exists() and p.read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a') for p in files), files"

      - name: Run Python Rendering tutorial
        if: matrix.build_type == 'Release'
        working-directory: ${{ github.workspace }}/python/tutorials
        env:
          PYTHONPATH: ${{ runner.workspace }}/build/python
          LD_LIBRARY_PATH: ${{ runner.workspace }}/install/lib:${{ env.LD_LIBRARY_PATH }}
          DYLD_LIBRARY_PATH: ${{ runner.workspace }}/install/lib:${{ env.DYLD_LIBRARY_PATH }}
        run: |
          python tutorial_rendering.py
          python -c "from pathlib import Path; files=[Path('tutorial_rendering_empty.png'),Path('tutorial_rendering_cleared.png')]; assert all(p.exists() and p.read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a') for p in files), files"


      - name: Verify Release uninstallation
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.workspace }}/build
        run: cmake --build . --target uninstall
